# CI/CD pipeline
#   pull request to main -> lint + tests
#   push to main         -> lint + tests -> deploy to EC2 (only if both passed)
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only values, the database lives only inside this job
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hotel_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hotel_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations work on an empty database (up, down, up)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -v

  deploy:
    name: Deploy to EC2
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
    steps:
      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ]; then
            echo "::error::Set secret EC2_SSH_KEY and variables EC2_HOST, EC2_USER in repo settings"
            exit 1
          fi
          mkdir -p ~/.ssh
          # Drop CR line endings and UTF-8 BOM bytes (added when the secret is set from Windows)
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r\357\273\277' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail early with a readable message; prints only line count + header, never the key
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key > /dev/null; then
            header=$(head -n1 ~/.ssh/deploy_key | grep -E '^-----' || echo 'not a PEM/OpenSSH header')
            echo "::error::EC2_SSH_KEY is not a valid private key: $(wc -l < ~/.ssh/deploy_key) lines, first line: $header"
            exit 1
          fi
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # deploy.sh: git pull -> pip install -> alembic upgrade head -> restart -> local /health
      - name: Pull, migrate and restart on the server
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "bash /opt/hotel-api/deploy/deploy.sh ${{ github.sha }}"

      - name: Public health check through Nginx
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://$EC2_HOST/health"; then exit 0; fi
            sleep 3
          done
          echo "::error::GET http://$EC2_HOST/health failed"
          exit 1
