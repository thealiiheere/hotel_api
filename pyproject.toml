[project]
name = "hotel-api"
version = "1.0.0"
description = "Hotel Booking API (FastAPI + PostgreSQL)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# the local "alembic/" migrations folder must not make ruff treat the alembic package as ours
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
